name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install './candidate[native]'
      - run: python -m unittest discover -v
        working-directory: candidate
        env:
          VCI_TEST_INTEGRATION: '0'
